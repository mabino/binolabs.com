<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bean Board BBS</title>
  <script>
    (function () {
      var t = localStorage.getItem('binolabs-theme') || localStorage.getItem('seccam-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-dark: #0a0b10;
      --card-bg: rgba(17, 18, 25, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(139, 92, 246, 0.35);
      --glow-color: rgba(139, 92, 246, 0.15);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 50%, #6d28d9 100%);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg-dark: #f3f4f8;
        --card-bg: rgba(255, 255, 255, 0.9);
        --card-border: rgba(0, 0, 0, 0.08);
        --card-border-hover: rgba(139, 92, 246, 0.45);
        --glow-color: rgba(139, 92, 246, 0.06);
        --text-main: #111827;
        --text-muted: #4b5563;
        --accent: #7c3aed;
      }
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg-dark: #f3f4f8;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-border-hover: rgba(139, 92, 246, 0.45);
      --glow-color: rgba(139, 92, 246, 0.06);
      --text-main: #111827;
      --text-muted: #4b5563;
      --accent: #7c3aed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px;
    }

    /* Glow Background Patterns */
    .glow-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      width: 100%;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* Header styling */
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: var(--accent-gradient);
      padding: 8px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
    }

    .logo-text {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #d1d5db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* Terminal Container */
    .terminal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--glow-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #fTelnetContainer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px;
    }

    /* Force the fTelnet status bar to sit below the terminal canvas */
    #fTelnetContainer #fTelnetStatusBar {
      position: static !important;
      width: 100% !important;
      flex-shrink: 0;
    }

    /* Back Button */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s ease;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 20px;
      border-radius: 30px;
    }

    .btn-back:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  
  <div class="container">
    <header class="header">
      <div class="logo-container">
        <div class="logo-icon">BBS</div>
        <span class="logo-text">The Bean Board</span>
      </div>
      <p class="subtitle">BinoLabs Synchronet BBS Client</p>
    </header>

    <div class="terminal-card">
      <div id="fTelnetContainer"></div>
    </div>

    <a href="https://binolabs.com" class="btn-back">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Home</span>
    </a>
    <footer style="margin-top: 30px; display: flex; align-items: center; justify-content: flex-end; gap: 12px; font-size: 11px; color: var(--text-muted);">
      <button id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme" style="border:0;background:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:4px;">◐</button>
      <span>&copy; 2026 BinoLabs</span>
    </footer>
  </div>

  <script src="ftelnet.norip.xfer.min.js" id="fTelnetScript"></script>
  <script>
    var Options = new fTelnetOptions();
    Options.Hostname = "binolabs.com";
    Options.Port = 443;
    Options.WebSocketUrlPath = "/bbs/wss/";
    var Client = new fTelnetClient('fTelnetContainer', Options);

    var themeBtn = document.getElementById('theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var pinned = document.documentElement.getAttribute('data-theme');
        var effective = pinned ||
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var next = effective === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('binolabs-theme', next);
      });
    }
  </script>
</body>
</html>
